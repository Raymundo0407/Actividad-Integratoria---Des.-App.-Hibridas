name: CI React Native Expo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verificar:
    name: Verificar proyecto Expo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar proyecto Expo
        run: npx expo-doctor

      - name: Generar exportacion de la aplicacion
        run: npx expo export --platform all
